name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # pnpm version is driven by package.json's "packageManager" field
      # (pnpm@9.12.0). Specifying `version:` here too is rejected by
      # action-setup@v4 with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # License gate: fail fast if any production dependency carries a license
      # outside the permissive allowlist (see docs/license-compliance-review-2026-07-14.md).
      - name: Check dependency licenses
        run: node scripts/check-licenses.mjs
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm test
      # Integration tests spawn real shells via node-pty. macOS-arm64 runners hit
      # posix_spawnp restrictions and Windows ConPTY is noisy under vitest's worker
      # pool. Cross-platform PTY behaviour is covered by the E2E suite below.
      - name: Run integration tests (Linux only)
        if: runner.os == 'Linux'
        run: pnpm test:integration
      # Build the desktop app on every OS so packaging-time breakage is caught per PR.
      - name: Build desktop app
        run: pnpm --filter @awakon/desktop build
      - name: Install Playwright + Chromium
        run: pnpm --filter @awakon/e2e exec playwright install --with-deps chromium
      # E2E on Linux for every PR + push.
      - name: Run E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      # Full E2E matrix on pushes to main (Windows + macOS).
      - name: Run E2E (Windows/macOS, main only)
        if: runner.os != 'Linux' && github.event_name == 'push'
        run: pnpm test:e2e
