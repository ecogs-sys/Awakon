<title>AI.Pad — Split + Doc Review</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --bg-0: oklch(0.155 0.008 250);
    --bg-1: oklch(0.195 0.008 250);
    --bg-2: oklch(0.235 0.008 250);
    --bg-3: oklch(0.275 0.009 250);
    --bg-4: oklch(0.325 0.010 250);
    --bg-overlay: oklch(0.10 0.008 250 / 0.7);
    --text-1: oklch(0.97 0.003 250);
    --text-2: oklch(0.74 0.006 250);
    --text-3: oklch(0.56 0.008 250);
    --text-4: oklch(0.42 0.008 250);
    --border-1: oklch(0.30 0.010 250 / 0.6);
    --border-2: oklch(0.36 0.012 250 / 0.5);
    --accent: oklch(0.72 0.12 230);
    --accent-soft: oklch(0.72 0.12 230 / 0.18);
    --accent-glow: oklch(0.72 0.12 230 / 0.35);
    --st-running: oklch(0.78 0.15 155);
    --st-running-bg: oklch(0.78 0.15 155 / 0.14);
    --st-awaiting: oklch(0.82 0.13 88);
    --st-awaiting-bg: oklch(0.82 0.13 88 / 0.16);
    --st-limited: oklch(0.70 0.18 25);
    --st-limited-bg: oklch(0.70 0.18 25 / 0.16);
    --st-idle: oklch(0.55 0.008 250);
    --st-idle-bg: oklch(0.55 0.008 250 / 0.14);
    --term-bg: oklch(0.165 0.008 250);
    --term-fg: oklch(0.92 0.004 250);
    --term-dim: oklch(0.62 0.006 250);
    --term-green: oklch(0.82 0.16 145);
    --term-cyan: oklch(0.80 0.12 200);
    --term-yellow: oklch(0.86 0.14 92);
    --term-blue: oklch(0.78 0.13 240);
    --term-magenta: oklch(0.74 0.14 320);
    --term-red: oklch(0.72 0.16 25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg-0); color: var(--text-1);
    font-family: var(--font-sans); font-size: 14px;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .dc-artboard { background: var(--bg-0); }
</style>
</head>
