<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Awakon — Terminal</title>
    <link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
      #term-root { width: 100%; height: 100%; }

      /* Scrollbars — matches chrome window so xterm viewport looks the same as sidebar/modals. */
      *::-webkit-scrollbar             { width: 6px; height: 6px; }
      *::-webkit-scrollbar-track       { background: transparent; }
      *::-webkit-scrollbar-thumb       { background: var(--bg-4); border-radius: 2px; }
      *::-webkit-scrollbar-thumb:hover { background: var(--text-4); }
      *::-webkit-scrollbar-corner      { background: transparent; }
    </style>
  </head>
  <body>
    <div id="term-root"></div>
    <script type="module" src="/src/renderer/terminal/main.ts"></script>
  </body>
</html>
